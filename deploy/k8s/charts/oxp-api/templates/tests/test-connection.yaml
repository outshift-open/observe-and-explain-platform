{{- if .Values.test -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "oxp-api.fullname" . }}-test-connection"
  labels:
    {{- include "oxp-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "oxp-api.fullname" . }}:{{ .Values.api.service.port }}/healthz']
  restartPolicy: Never
{{- end -}}
