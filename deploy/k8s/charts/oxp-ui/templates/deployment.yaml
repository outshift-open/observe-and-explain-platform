apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxp-ui.fullname" . }}
  labels:
    {{- include "oxp-ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "oxp-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "oxp-ui.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- $globalValues := get .Values "global" | default dict }}
      {{- $globalPullSecrets := get $globalValues "imagePullSecrets" | default (list) }}
      {{- $pullSecrets := .Values.imagePullSecrets | default $globalPullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "oxp-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if eq .Values.syncSecretsFromVault.enabled false }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-configmap
          {{- end }}
          {{- if or .Values.syncSecretsFromVault.enabled .Values.environment }}
          env:
            {{- if .Values.syncSecretsFromVault.enabled }}
            - name: VITE_API_PROXY_URL
              value: {{ include "oxp-ui.apiProxyBaseUrl" . | quote }}
            - name: VITE_REST_API_URL
              value: {{ include "oxp-ui.restApiUrl" . | quote }}
            - name: VITE_FF_SEMANTIC_GROUPS
              value: "{{ .Values.featureFlags.semanticGroups }}"
            - name: VITE_FF_INSIGHTS
              value: "{{ .Values.featureFlags.insights }}"
            - name: VITE_FF_LIVE_TOPOLOGY
              value: "{{ .Values.featureFlags.liveTopology }}"
            - name: VITE_FF_STATEFUL_EVAL
              value: "{{ .Values.featureFlags.statefulEval }}"
            - name: VITE_FF_IMPACT_ASSESSMENT
              value: "{{ .Values.featureFlags.impactAssessment }}"
            - name: VITE_FF_WASTE_ESTIMATION
              value: "{{ .Values.featureFlags.wasteEstimation }}"
            - name: VITE_FF_NEUROSYMBOLIC_EVAL
              value: "{{ .Values.featureFlags.neurosymbolicEval }}"
            {{- end }}
            {{- with .Values.environment }}
            {{- toYaml . | nindent 12 }}
            {{- end  }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.copilot.enabled }}
        - name: {{ .Chart.Name }}-copilot
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.copilot.image.repository }}:{{ .Values.copilot.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.copilot.image.pullPolicy }}
          ports:
            - name: http-copilot
              containerPort: {{ .Values.copilot.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.copilot.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.copilot.readinessProbe | nindent 12 }}
          {{- if eq .Values.syncSecretsFromVault.enabled false }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-copilot-configmap
          {{- end }}
          {{- if or .Values.syncSecretsFromVault.enabled .Values.environment }}
          env:
            {{- if .Values.syncSecretsFromVault.enabled }}
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "config.secretName" . }}
                  key: azureOpenaiEndpoint
            - name: AZURE_OPENAI_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: {{ include "config.secretName" . }}
                  key: azureOpenaiApiVersion
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "config.secretName" . }}
                  key: azureOpenaiApiKey
            - name: ALLOWED_ORIGIN
              value: {{ .Values.copilot.allowedOrigin | quote }}
            {{- end }}
            {{- with .Values.environment }}
            {{- toYaml . | nindent 12 }}
            {{- end  }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
