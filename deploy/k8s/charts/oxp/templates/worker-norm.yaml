{{- $worker := .Values.workers.norm -}}
{{- if and .Values.workers.enabled $worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxp.workerDeploymentName" (dict "root" . "name" "norm") }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/worker-name: norm
spec:
  replicas: {{ default 1 $worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "oxp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/worker-name: norm
  template:
    metadata:
      labels:
        {{- include "oxp.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/worker-name: norm
    spec:
      {{- $globalValues := get .Values "global" | default dict }}
      {{- $globalPullSecrets := get $globalValues "imagePullSecrets" | default (list) }}
      {{- $pullSecrets := .Values.imagePullSecrets | default $globalPullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitInitContainers := include "oxp.workerInitContainers.waitDependencies" (dict "root" . "includeClickhouse" true) }}
      {{- if $waitInitContainers }}
      initContainers:
        {{- $waitInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: norm
          image: "{{ $worker.image.repository }}:{{ $worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $worker.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "oxp.workerEnvConfigMapName" . }}
          {{- with $worker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "oxp.rabbitmqWorkerEnv" . | nindent 12 }}
            {{- include "oxp.clickhouseWorkerEnv" . | nindent 12 }}
            {{- include "oxp.neo4jWorkerEnv" . | nindent 12 }}
            - name: NORM_INPUT_QUEUE
              value: {{ $worker.inputQueue | quote }}
            - name: NORM_OUTPUT_QUEUE
              value: {{ include "oxp.listOrStringEnvValue" $worker.outputQueue | quote }}
            {{ if $worker.feedbackQueue }}
            - name: NORM_FEEDBACK_QUEUE
              value: {{ $worker.feedbackQueue | quote }}
            {{ end }}
            - name: MAX_INFLIGHT_MESSAGES
              value: {{ $worker.maxInflightMessages | quote }}
          {{- with $worker.extraEnv }}
            {{- range $envName, $envValue := . }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          {{- with $worker.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $worker.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
