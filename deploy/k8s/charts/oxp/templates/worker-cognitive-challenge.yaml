{{- $worker := index .Values.workers "cognitive-challenge" -}}
{{- if and .Values.workers.enabled $worker.enabled }}
{{- $workerOverrides := default dict $worker.secretOverrides }}
{{- $llmSecretName := include "oxp.secretName" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxp.workerDeploymentName" (dict "root" . "name" "cognitive-challenge") }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/worker-name: cognitive-challenge
spec:
  replicas: {{ default 1 $worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "oxp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
      app.kubernetes.io/worker-name: cognitive-challenge
  template:
    metadata:
      labels:
        {{- include "oxp.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        app.kubernetes.io/worker-name: cognitive-challenge
    spec:
      {{- $globalValues := get .Values "global" | default dict }}
      {{- $globalPullSecrets := get $globalValues "imagePullSecrets" | default (list) }}
      {{- $pullSecrets := .Values.imagePullSecrets | default $globalPullSecrets }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $waitInitContainers := include "oxp.workerInitContainers.waitDependencies" (dict "root" . "includeClickhouse" true) }}
      {{- if $waitInitContainers }}
      initContainers:
        {{- $waitInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: cognitive-challenge
          image: "{{ $worker.image.repository }}:{{ $worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ $worker.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "oxp.workerEnvConfigMapName" . }}
          {{- with $worker.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "oxp.rabbitmqWorkerEnv" . | nindent 12 }}
            {{- include "oxp.clickhouseWorkerEnv" . | nindent 12 }}
            {{- include "oxp.neo4jWorkerEnv" . | nindent 12 }}
            - name: COGNITIVE_CHALLENGE_INPUT_QUEUE
              value: {{ $worker.inputQueue | quote }}
            - name: COGNITIVE_CHALLENGE_OUTPUT_QUEUE
              value: {{ include "oxp.listOrStringEnvValue" $worker.outputQueue | quote }}
            {{ if $worker.feedbackQueue }}
            - name: COGNITIVE_CHALLENGE_FEEDBACK_QUEUE
              value: {{ $worker.feedbackQueue | quote }}
            {{ end }}
            {{- $cognitiveChallengeLlmModelKey := default .Values.secrets.llm.llmModelNameKey (get $workerOverrides "llmModelNameKey") }}
            - name: LLM_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $llmSecretName }}
                  key: {{ $cognitiveChallengeLlmModelKey }}
            - name: COGNITIVE_CHALLENGE_CONFIG_PATH
              value: {{ $worker.configPath | quote }}
            - name: MAX_INFLIGHT_MESSAGES
              value: {{ $worker.maxInflightMessages | quote }}
            {{- if $workerOverrides.aiGatewayApiKey }}
            - name: OPENAI_API_KEY
              value: {{ $workerOverrides.aiGatewayApiKey | quote }}
            {{- else }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $llmSecretName }}
                  key: {{ .Values.secrets.llm.llmGatewayApiKeyKey }}
            {{- end }}
            {{- if $workerOverrides.aiGatewayBaseUrl }}
            - name: LLM_BASE_MODEL_URL_MCE
              value: {{ $workerOverrides.aiGatewayBaseUrl | quote }}
            {{- else }}
            - name: LLM_BASE_MODEL_URL_MCE
              valueFrom:
                secretKeyRef:
                  name: {{ $llmSecretName }}
                  key: {{ .Values.secrets.llm.llmGatewayBaseUrlKey }}
            {{- end }}
          {{- with $worker.extraEnv }}
            {{- range $envName, $envValue := . }}
            - name: {{ $envName }}
              value: {{ $envValue | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $worker.resources | nindent 12 }}
          volumeMounts:
            - name: cognitive-challenge-config
              mountPath: {{ $worker.configPath }}
              subPath: cognitive_challenge_config.yaml
            {{- with $worker.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: cognitive-challenge-config
          configMap:
            name: {{ include "oxp.cognitiveChallengeConfigMapName" . }}
        {{- with $worker.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
