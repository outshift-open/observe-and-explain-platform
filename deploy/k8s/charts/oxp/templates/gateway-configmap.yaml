{{- if .Values.gateway.enabled }}
{{- $gatewayName := default (include "oxp.fullname" .) .Values.gateway.fullnameOverride -}}
{{- $gatewayConfigName := printf "%s-nginx" $gatewayName -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $gatewayConfigName }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      # Route API calls to the internal API service.
      location ^~ /gql {
        proxy_pass http://{{ .Values.gateway.nginx.apiHost }}:{{ .Values.gateway.nginx.apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ^~ /api/v1 {
        proxy_pass http://{{ .Values.gateway.nginx.apiHost }}:{{ .Values.gateway.nginx.apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ^~ /api/v1alpha {
        proxy_pass http://{{ .Values.gateway.nginx.apiHost }}:{{ .Values.gateway.nginx.apiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # Route everything else to UI.
      location / {
        proxy_pass http://{{ .Values.gateway.nginx.uiHost }}:{{ .Values.gateway.nginx.uiPort }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
{{- end }}