{{- if not .Values.secrets.llm.existingSecret }}
{{- $llmModelName := required "secrets.llm.llmModelName is required when secrets.llm.existingSecret is empty" .Values.secrets.llm.llmModelName }}
{{- $embeddingModelName := required "secrets.llm.embeddingModelName is required when secrets.llm.existingSecret is empty" .Values.secrets.llm.embeddingModelName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.llm.name }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.llm.llmGatewayApiKeyKey }}: {{ .Values.secrets.llm.llmGatewayApiKey | quote }}
  {{ .Values.secrets.llm.llmGatewayBaseUrlKey }}: {{ .Values.secrets.llm.llmGatewayBaseUrl | quote }}
  {{ .Values.secrets.llm.llmModelNameKey }}: {{ $llmModelName | quote }}
  {{ .Values.secrets.llm.embeddingModelNameKey }}: {{ $embeddingModelName | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.llm.llmGatewayApiKey | quote }}
  AI_GATEWAY_API_KEY: {{ .Values.secrets.llm.llmGatewayApiKey | quote }}
  AI_GATEWAY_BASE_URL: {{ .Values.secrets.llm.llmGatewayBaseUrl | quote }}
  LLM_API_KEY: {{ .Values.secrets.llm.llmGatewayApiKey | quote }}
  LLM_BASE_MODEL_URL: {{ .Values.secrets.llm.llmGatewayBaseUrl | quote }}
  LLM_BASE_MODEL_URL_MCE: {{ .Values.secrets.llm.llmGatewayBaseUrl | quote }}
  LLM_MODEL_NAME: {{ $llmModelName | quote }}
  EMBEDDING_MODEL: {{ $embeddingModelName | quote }}
---
{{- end }}

{{- if not .Values.clickhouse.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clickhouse.auth.secretName }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.clickhouse.auth.usernameKey }}: {{ .Values.clickhouse.auth.username | quote }}
  {{ .Values.clickhouse.auth.passwordKey }}: {{ .Values.clickhouse.auth.password | quote }}
{{- end }}

{{- $rabbitmqExistingSecret := .Values.rabbitmq.auth.existingSecret }}
{{- if and .Values.rabbitmq.enabled (not $rabbitmqExistingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rabbitmq.auth.secretName }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.rabbitmq.auth.usernameKey }}: {{ .Values.rabbitmq.auth.username | quote }}
  {{ .Values.rabbitmq.auth.passwordKey }}: {{ .Values.rabbitmq.auth.password | quote }}
{{- end }}

{{- if not .Values.clickhouse.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oxp.clickhouseUsersSecretName" . }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.xml: |
    <clickhouse>
      <users>
        <{{ include "oxp.clickhouseUsername" . }}>
          <password>{{ include "oxp.clickhousePassword" . }}</password>
          <networks>
            <ip>::/0</ip>
          </networks>
          <profile>default</profile>
          <quota>default</quota>
        </{{ include "oxp.clickhouseUsername" . }}>
      </users>
    </clickhouse>
  CLICKHOUSE_USER: {{ include "oxp.clickhouseUsername" . | quote }}
  CLICKHOUSE_PASSWORD: {{ include "oxp.clickhousePassword" . | quote }}
{{- end }}

{{- $oxpApi := .Values.api }}
{{- $apiRootCaSecret := default dict $oxpApi.apiRootCaSecret }}
{{- if $apiRootCaSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ default $oxpApi.apiRootCaSecretName $apiRootCaSecret.name }}
  labels:
    {{- include "oxp.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
{{ $apiRootCaSecret.caCrt | default "" | indent 4 }}
{{- end }}
