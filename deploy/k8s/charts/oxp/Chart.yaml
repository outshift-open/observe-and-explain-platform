apiVersion: v2
name: oxp
description: Umbrella Helm chart for the Observe & Explain Platform (OXP)
maintainers:
  - name: tfeltin
    email: tfeltin@cisco.com
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: oxp-api
    alias: api
    version: 1.0.0
    repository: https://chartmuseum.prod.eticloud.io/
    condition: api.enabled
  - name: oxp-ui
    alias: ui
    version: 1.0.0
    repository: https://chartmuseum.prod.eticloud.io/
    condition: ui.enabled
  - name: opentelemetry-collector
    alias: otelCollector
    version: 0.165.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otelCollector.enabled
  - name: neo4j
    alias: neo4j
    version: 2026.6.0
    repository: https://neo4j.github.io/helm-charts/
    condition: neo4j.enabled
