server {
    listen       8080;
    server_name  ~^.+$;
    large_client_header_buffers 4 16k;
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        ssi on;
        set $restApiUrl "${VITE_REST_API_URL}";
        set $ffSemanticGroups "${VITE_FF_SEMANTIC_GROUPS}";
        set $ffInsights "${VITE_FF_INSIGHTS}";
        set $ffLiveTopology "${VITE_FF_LIVE_TOPOLOGY}";
        set $ffStatefulEval "${VITE_FF_STATEFUL_EVAL}";
        set $ffImpactAssessment "${VITE_FF_IMPACT_ASSESSMENT}";
        set $ffWasteEstimation "${VITE_FF_WASTE_ESTIMATION}";
        set $ffNeurosymbolicEval "${VITE_FF_NEUROSYMBOLIC_EVAL}";
        set $ffCognitiveObservability "${VITE_FF_COGNITIVE_OBSERVABILITY}";
        set $ffL9Protocols "${VITE_FF_L9_PROTOCOLS}";
    }
    error_page   500 502 503 504  /50x.html;
    location /rest {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass ${VITE_API_PROXY_URL}/rest;
    }
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}