services:
  oxp-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:8080'
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
