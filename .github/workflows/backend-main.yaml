name: Image Builder for OXP Backend

on:
  # a tag push is what actually triggers a registry push in the reusable workflow
  push:
    tags:
      - 'backend-v*'
  workflow_dispatch:

jobs:
  prep:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Strip backend-v prefix from tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME#backend-v}" >> "$GITHUB_OUTPUT"

  call-docker-build-push:
    name: Build and push ${{ matrix.target }}
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - norm-worker
          - mce-worker
          - embedding-worker
          - grouping-worker
          - hierarchical-grouping-worker
          - analysis-worker
          - anomaly-detection-worker
          - consistency-worker
          - normal-behaviour-worker
          - intelligence-worker
          - stateful-eval-worker
    permissions:
      contents: read  # required for actions/checkout
      packages: write # required to push the image to GHCR
    uses: ./.github/workflows/reusable-docker-build-push.yml
    with:
      bake-targets: ${{ matrix.target }}
      image-tag: ${{ needs.prep.outputs.image-tag }}
      image-repo: ghcr.io/outshift-open/oxp-${{ matrix.target }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
