name: Image Builder for OXP-UI

on:
  # a tag push is what actually triggers a registry push in the reusable workflow
  push:
    tags:
      - 'ui-v*'
  workflow_dispatch:

jobs:
  prep:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Strip ui-v prefix from tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME#ui-v}" >> "$GITHUB_OUTPUT"

  call-docker-build-push:
    name: Build and push OXP UI image
    needs: prep
    permissions:
      contents: read  # required for actions/checkout
      packages: write # required to push the image to GHCR
    uses: ./.github/workflows/reusable-docker-build-push.yml
    with:
      bake-targets: ui
      image-tag: ${{ needs.prep.outputs.image-tag }}
      image-repo: ghcr.io/outshift-open/oxp-ui
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
