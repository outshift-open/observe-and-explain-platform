name: oxp

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_USER: ${RABBITMQ_USER:-guest}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/ # legit:ignore

x-worker-env: &worker-env
  <<: *rabbitmq-env
  HOME: /oxp
  MPLCONFIGDIR: /oxp/.config/matplotlib
  API_BASE_URL: http://host.docker.internal:8081
  NEO4J_HOST: neo4j:7687
  NEO4J_URI: bolt://neo4j:7687
  UV_LINK_MODE: copy
  UV_PROJECT_ENVIRONMENT: /opt/venv
  PYTHONUNBUFFERED: 1
  MLFLOW_TRACKING_URI: http://${MLFLOW_HOST}:${MLFLOW_PORT:-5000}
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USERNAME: ${CLICKHOUSE_USERNAME:-admin}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}

x-worker-base: &worker-base
  env_file: .env
  depends_on:
    rabbitmq:
      condition: service_healthy
    neo4j:
      condition: service_healthy
  volumes:
    - ./mce_config.yaml:/oxp/mce_config.yaml
    - /dev/null:/app/workflows/.env
  environment: *worker-env

services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD} # legit:ignore
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:latest
    volumes:
        - /$HOME/neo4j/logs:/logs
        - /$HOME/neo4j/config:/config
        - /$HOME/neo4j/data:/data
        - /$HOME/neo4j/plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-testpassword} # legit:ignore
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  norm:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/norm-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command: ["--max-sessions", "-1"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${NORM_MAX_INFLIGHT_MESSAGES:-64}
    restart: always

  embedding:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/embedding-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command: ["--embedder-type", "OpenAIEmbedder", "--embedding-model", "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${EMBEDDING_MAX_INFLIGHT_MESSAGES:-16}
      EMBEDDING_OUTPUT_QUEUE: ${EMBEDDING_OUTPUT_QUEUE:-new_session_to_grouping,new_session_to_stateful_eval}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  mce:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/mce-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command: ["--config-file", "/oxp/mce_config.yaml"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${MCE_MAX_INFLIGHT_MESSAGES:-16}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  grouping:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/grouping-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command: ["--embedding-model", "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"]
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${GROUPING_MAX_INFLIGHT_MESSAGES:-16}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  analysis:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/analysis-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command:
      - "--embedding-model"
      - "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${ANALYSIS_MAX_INFLIGHT_MESSAGES:-3}
      ANOMALY_CONFIG_FILE: ${ANOMALY_CONFIG_FILE:-}
      CONSISTENCY_CONFIG_FILE: ${CONSISTENCY_CONFIG_FILE:-}
      NORMAL_BEHAVIOUR_CONFIG_FILE: ${NORMAL_BEHAVIOUR_CONFIG_FILE:-}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  hierarchical-grouping:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/hierarchical-grouping-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command:
      - "--embedding-model"
      - "${EMBEDDING_MODEL:-azure/text-embedding-3-small}"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${HIERARCHICAL_GROUPING_MAX_INFLIGHT_MESSAGES:-1}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  intelligence:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/intelligence-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    command:
      - "--catalog-root"
      - "intelligence-catalog"
    environment:
      <<: *worker-env
      MAX_INFLIGHT_MESSAGES: ${INTELLIGENCE_MAX_INFLIGHT_MESSAGES:-1}
      PERIODIC_TRIGGER_INTERVAL_SECONDS: ${INTELLIGENCE_PERIODIC_TRIGGER_INTERVAL_SECONDS:-600}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      norm:
        condition: service_started

  stateful-eval:
    <<: *worker-base
    build:
      context: .
      dockerfile: workers/stateful-eval-worker/deploy/docker/Dockerfile
      secrets:
        - ARTIFACTORY_USERNAME
        - ARTIFACTORY_PASSWORD
    environment:
      <<: *worker-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${AI_GATEWAY_API_KEY:-}}
      STATEFUL_EVAL_INPUT_QUEUE: ${STATEFUL_EVAL_INPUT_QUEUE:-new_session_to_stateful_eval}
      MAX_INFLIGHT_MESSAGES: ${STATEFUL_EVAL_MAX_INFLIGHT_MESSAGES:-8}
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy

secrets:
  ARTIFACTORY_USERNAME:
    environment: "UV_INDEX_OUTSHIFT_PYPI_USERNAME"
  ARTIFACTORY_PASSWORD:
    environment: "UV_INDEX_OUTSHIFT_PYPI_PASSWORD"
