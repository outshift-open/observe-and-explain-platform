[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "normal-behaviour-worker"
version = "1.0.0"
authors = [
    { name = "Outshift Open", email = "oss@cisco.com" }
]
license = "Apache-2.0"
description = "Standalone normal behaviour worker"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

requires-python = ">=3.11"
dependencies = [
    "oxp-api",
    "oxp-ontology[models]>=1.0.1",
    "dem[analysis]",
    "worker-base",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "aio_pika>=8.0.0",
    "pika>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=4.4.0",
    "ruff<=0.15.22",
]

[project.scripts]
normal-behaviour-worker-cli = "normal_behaviour_worker.cli:main"

[tool.uv.sources]
oxp-api = { workspace = true }
dem = { workspace = true }
worker-base = { workspace = true }

[project.urls]
Homepage = "https://github.com/agntcy/telemetry-hub"
Repository = "https://github.com/agntcy/telemetry-hub"

[tool.hatch.build.targets.wheel]
packages = ["src/normal_behaviour_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
