[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mce-worker"
version = "1.0.0"
license = "Apache-2.0"
description = "Standalone MCE (Metrics Computation Engine) worker for processing telemetry sessions"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

requires-python = ">=3.11"
dependencies = [
    "mce",
    "mce-client",
    "worker-base",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "aio_pika>=8.0.0",
    "pika>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=4.4.0",
    "ruff<=0.15.22",
]

[project.scripts]
mce-worker-cli = "mce_worker.cli:main"

[tool.uv.sources]
mce = { workspace = true }
mce-client = { workspace = true }
worker-base = { workspace = true }

[project.urls]
Homepage = "https://github.com/agntcy/telemetry-hub"
Repository = "https://github.com/agntcy/telemetry-hub"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
