[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rt-norm-worker"
version = "1.0.0"
authors = [
    { name = "Outshift Open", email = "oss@cisco.com" }
]
license = "Apache-2.0"
description = "Standalone real-time normalization worker (does not use worker-base)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0.0",
    "norm",
    "oxp-api",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
rt-norm-worker-cli = "rt_norm_worker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rt_norm_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
