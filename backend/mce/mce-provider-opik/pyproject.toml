[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mce-provider-opik"
version = "0.1.0"
description = "Opik provider package for MCE"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mce-core>=2.0.0rc1",
    "opik>=1.8.27",
    "nltk",
    "rouge-score",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mce.providers.opik*"]
namespaces = true

[tool.uv.sources]
mce-core = { workspace = true }