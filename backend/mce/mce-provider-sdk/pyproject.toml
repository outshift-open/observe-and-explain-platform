[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mce-provider-sdk"
version = "0.1.0"
description = "SDK-backed MCE provider package"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mce-core>=2.0.0rc1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mce.providers.sdk*"]
namespaces = true

[tool.uv.sources]
mce-core = { workspace = true }