[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mce-helper"
version = "0.1.0"
description = "MCE helper interfaces"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mce-core>=2.0.0rc1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mce.helper*"]
namespaces = true

[tool.uv.sources]
mce-core = { workspace = true }