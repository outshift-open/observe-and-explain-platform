[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mce-legacy"
version = "0.1.0"
description = "Legacy adapters and compatibility layer for MCE"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mce-core>=2.0.0rc1",
    "mce-provider-native>=0.1.0",
    "mce-provider-sdk>=0.1.0",
    "click>=8.0.0",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mce.legacy*"]
namespaces = true

[tool.uv.sources]
mce-core = { workspace = true }
mce-provider-native = { workspace = true }
mce-provider-sdk = { workspace = true }