[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oxp-mce-legacy"
version = "0.1.0"
authors = [
    { name = "Outshift Open", email = "oss@cisco.com" }
]
license = "Apache-2.0"
description = "Legacy adapters and compatibility layer for MCE"
requires-python = ">=3.13,<3.15"
dependencies = [
    "oxp-mce-core>=2.0.0rc1",
    "oxp-mce-provider-native>=0.1.0",
    "oxp-mce-provider-sdk>=0.1.0",
    "click>=8.0.0",
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mce.legacy*"]
namespaces = true

[tool.uv.sources]
oxp-mce-core = { workspace = true }
oxp-mce-provider-native = { workspace = true }
oxp-mce-provider-sdk = { workspace = true }